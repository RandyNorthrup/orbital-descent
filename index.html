<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A modern 2D lunar lander game: rotate and thrust to fight gravity and land safely."
    />
    <title>Lunar Lander</title>
  </head>
  <body>
    <div
      id="app"
      role="img"
      aria-label="Lunar Lander game canvas. Controls: W or Up Arrow to thrust, A/D or Left/Right Arrow to rotate."
    >
      <!--
        Real, immediately-painted DOM text so the browser has an LCP
        candidate before Phaser boots — canvas/WebGL content is invisible to
        Largest Contentful Paint detection, so without this the Performance
        category is unscorable (confirmed: every metric errored NO_LCP in a
        real Lighthouse run). Removed by BootScene once Phaser's own canvas
        takes over. See PLAN.md §5.
      -->
      <p id="loading-label">LUNAR LANDER</p>
    </div>
    <noscript>Lunar Lander requires JavaScript to run.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
